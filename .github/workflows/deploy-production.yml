name: Deploy Cloudflare Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy production main
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # Temporary: allow fresh package versions while the lockfile contains recently published releases.
        # Restore the default pnpm cooldown once dependencies are deliberately pinned/aged.
        run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0

      - name: Build main app
        run: pnpm run build:main

      - name: Apply production database migrations
        run: pnpm run db:migrate:production

      - name: Deploy main production environment
        run: pnpm run deploy:main:production
