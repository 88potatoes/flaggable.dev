name: Deploy Cloudflare Development

on:
  push:
    branches:
      - main
    paths:
      - "apps/landing/**"
      - "apps/main/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy landing + dev main
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # Temporary: allow fresh package versions while the lockfile contains recently published releases.
        # Restore the default pnpm cooldown once dependencies are deliberately pinned/aged.
        run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0

      - name: Build both apps
        run: pnpm run build

      - name: Apply development database migrations
        run: pnpm run db:migrate:dev

      - name: Deploy landing worker
        run: pnpm run deploy:landing

      - name: Deploy main development worker
        run: pnpm run deploy:main
